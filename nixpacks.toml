$nixpacks = @"
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "uvicorn api_server:app --host 0.0.0.0 --port `$PORT"
"@
[System.IO.File]::WriteAllText("$PWD\nixpacks.toml", $nixpacks)
